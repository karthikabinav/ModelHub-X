name: Issue Automation

on:
  issues:
    types: [opened, labeled]

jobs:
  respond-to-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on issue based on labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            
            let comment = "Hello, world!";
            
            if (labels.includes("bug")) {
              comment = "Thank you. We will fix it.";
            } else if (labels.includes("feature")) {
              comment = "Thank you, we will consider to include this feature.";
            }
            
            // Check if bot already commented to avoid duplicates
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });
            
            const botComment = comments.data.find(c => c.body === comment);
            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });
            }